name: catalog

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Weekly, so that values growing stale are flagged even when nothing
    # changes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/catalog.py validate --max-age-days 180
      - name: Test the scrapers and the merge guard
        run: python -m unittest discover -s tools -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    # Shared with publish.yml, so that a release tagged by hand and one
    # published on a data change never run together: the later one becomes
    # the latest release, whatever its version.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/catalog.py build --version "${GITHUB_REF_NAME}" --output dist/catalog.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/catalog.json --title "${GITHUB_REF_NAME}" --notes "Catalog ${GITHUB_REF_NAME}, licensed under the ODbL 1.0."
