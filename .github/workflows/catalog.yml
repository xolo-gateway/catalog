name: catalog

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so that values growing stale are flagged even when nothing
    # changes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/catalog.py validate --max-age-days 180
      - name: Test the scrapers and the merge guard
        run: python -m unittest discover -s tools -v
