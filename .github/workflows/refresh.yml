name: refresh

# Every day, the scrapers re-read the providers' published data. When a
# provider changed something, the run opens (or updates) one pull request.
# It merges on its own only when every safeguard holds: each scraper read
# its page strictly, a second run read it the same way, the catalog
# validates, the scraper tests pass, and the guard finds no change a
# misread page could cause (tools/guard.py). Anything else waits for a
# maintainer's review: the catalog feeds the prices Xolo bills with.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Test the scrapers on their frozen pages
        run: python -m unittest discover -s tools
      - name: Scrape the providers
        id: scrape
        # A source that fails writes nothing and is reported; the others
        # still refresh, but nothing merges on its own that day.
        continue-on-error: true
        run: python tools/refresh.py --today "$(date -u +%F)"
      - name: Check that a second run reads the same
        id: deterministic
        continue-on-error: true
        run: |
          snapshot="$(mktemp -d)"
          cp -r providers models "$snapshot/"
          python tools/refresh.py --today "$(date -u +%F)" || true
          diff -r "$snapshot/providers" providers
          diff -r "$snapshot/models" models
      - name: Validate
        run: python tools/catalog.py validate --max-age-days 180
      - name: Guard against implausible changes
        id: guard
        run: python tools/guard.py --base HEAD --github-output "$GITHUB_OUTPUT" || true
      - name: Propose the changes
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          # A dedicated token rather than the workflow's own: the
          # organization does not let GitHub Actions open pull requests,
          # and a pull request opened with GITHUB_TOKEN would not run the
          # validation workflow either. Fine-grained, this repository only:
          # Contents and Pull requests, read and write.
          token: ${{ secrets.CATALOG_BOT_TOKEN }}
          branch: refresh/daily
          delete-branch: true
          commit-message: "data: refresh from the providers' published data"
          title: "data: refresh from the providers' published data"
          body: |
            Changes the daily scrapers found in the providers' published data.

            | Safeguard | Outcome |
            | --- | --- |
            | Every scraper read its page | `${{ steps.scrape.outcome }}` |
            | A second run read the same | `${{ steps.deterministic.outcome }}` |
            | Guard against implausible changes | `${{ steps.guard.outputs.safe == 'true' && 'safe' || 'review needed' }}` |

            ${{ steps.guard.outputs.safe == 'true' && steps.scrape.outcome == 'success' && steps.deterministic.outcome == 'success' && 'Every safeguard holds: this pull request merges on its own once its checks pass.' || 'A safeguard did not hold: check each changed value against its `source` before merging.' }}

            ${{ steps.guard.outputs.reasons }}
          labels: data
      - name: Merge on its own when every safeguard holds
        if: >-
          steps.pr.outputs.pull-request-number &&
          steps.scrape.outcome == 'success' &&
          steps.deterministic.outcome == 'success' &&
          steps.guard.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.CATALOG_BOT_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --auto --squash --delete-branch -R "${{ github.repository }}"
      - name: Otherwise hold it for review
        if: >-
          steps.pr.outputs.pull-request-number && !(
          steps.scrape.outcome == 'success' &&
          steps.deterministic.outcome == 'success' &&
          steps.guard.outputs.safe == 'true')
        env:
          GH_TOKEN: ${{ secrets.CATALOG_BOT_TOKEN }}
        # An auto-merge enabled by an earlier run on the same branch must
        # not carry today's changes through.
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --disable-auto -R "${{ github.repository }}" || true
      - name: Fail when a source broke or read differently twice
        if: steps.scrape.outcome == 'failure' || steps.deterministic.outcome == 'failure'
        run: exit 1
